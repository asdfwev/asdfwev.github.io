<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사본 워터마크</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="사본 워터마크">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#fff;--fg:#1c1c1e;--sub:#6e6e73;--line:#d1d1d6;--card:#f2f2f7;--err:#d70015;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#f2f2f7;--sub:#a1a1a6;--line:#3a3a3c;--card:#2c2c2e;--err:#ff6961}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:4px 0 16px}
.pick{position:relative;display:block;padding:18px;border:1.5px dashed var(--line);border-radius:14px;background:var(--card);text-align:center;font-weight:600}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.row{display:flex;align-items:center;gap:12px;margin-top:14px}
.key{min-width:52px;color:var(--sub);font-size:15px}
input[type=text]{flex:1;min-width:0;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input[type=range]{flex:1;accent-color:#E24B4A}
input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:#E24B4A}
.val{min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.sw{-webkit-appearance:none;appearance:none;width:34px;height:34px;padding:0;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--fg)}
#out{display:none;width:100%;margin-top:18px;border-radius:10px;border:1px solid var(--line)}
#save{-webkit-appearance:none;appearance:none;width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:var(--fg);color:var(--bg);font-size:17px;font-weight:600}
#msg{margin:10px 0 0;font-size:14px;color:var(--sub)}
#msg.err{color:var(--err)}
</style>
</head>
<body>
<main>
<h1>사본 워터마크</h1>
<label class="pick"><span id="pickTxt">신분증 사진 선택</span><input id="file" type="file" accept="image/*"></label>
<div class="row"><label class="key" for="text">문구</label><input id="text" type="text" value="사본"></div>
<div class="row"><label class="key" for="dest">제출처</label><input id="dest" type="text" placeholder="세관 (비워 둬도 돼요)"></div>
<div class="row"><span class="key">날짜</span><label style="display:flex;align-items:center;gap:8px"><input id="date" type="checkbox"><span id="dateTxt">오늘 날짜 넣기</span></label></div>
<div class="row"><label class="key" for="alpha">진하기</label><input id="alpha" type="range" min="10" max="60" value="30"><span class="val" id="alphaV">30%</span></div>
<div class="row"><label class="key" for="size">크기</label><input id="size" type="range" min="4" max="16" value="8"><span class="val" id="sizeV">8</span></div>
<div class="row"><span class="key">색</span>
<button class="sw on" data-c="#E24B4A" style="background:#E24B4A" aria-label="빨강"></button>
<button class="sw" data-c="#5F5E5A" style="background:#5F5E5A" aria-label="회색"></button>
<button class="sw" data-c="#185FA5" style="background:#185FA5" aria-label="파랑"></button>
</div>
<img id="out" alt="워터마크 미리보기">
<button id="save">사진으로 저장</button>
<p id="msg">사진은 이 폰 안에서만 처리되고 어디에도 업로드되지 않아요. 저장할 때 위치정보 같은 메타데이터도 빠져요.</p>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i);};
var file=$('file'),text=$('text'),dest=$('dest'),date=$('date'),alpha=$('alpha'),size=$('size'),out=$('out'),save=$('save'),msg=$('msg');
var cv=document.createElement('canvas'),ctx=cv.getContext('2d');
var img=null,color='#E24B4A',dataUrl=null,timer=null,lastUrl=null,firstMsg=msg.textContent;
function today(){var n=new Date();return n.getFullYear()+'.'+String(n.getMonth()+1).padStart(2,'0')+'.'+String(n.getDate()).padStart(2,'0');}
function say(t,err){msg.textContent=t;msg.className=err?'err':'';}
function readouts(){$('alphaV').textContent=alpha.value+'%';$('sizeV').textContent=size.value;$('dateTxt').textContent='오늘 날짜 넣기 ('+today()+')';}
function label(){
var parts=[text.value.trim()||'사본'],d=dest.value.trim();
if(d){parts.push(/제출용$/.test(d)?d:d+' 제출용');}
if(date.checked){parts.push(today());}
return parts.join(' · ');
}
function render(){
readouts();
if(!img){return;}
var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,2400/Math.max(w,h));
w=Math.round(w*k);h=Math.round(h*k);
cv.width=w;cv.height=h;
ctx.drawImage(img,0,0,w,h);
var fs=Math.max(14,Math.round(Math.sqrt(w*h)*size.value/100)),t=label();
ctx.save();
ctx.globalAlpha=alpha.value/100;
ctx.fillStyle=color;
ctx.font='700 '+fs+'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
ctx.textAlign='center';ctx.textBaseline='middle';
ctx.translate(w/2,h/2);ctx.rotate(-Math.PI/6);
var D=Math.sqrt(w*w+h*h),sx=ctx.measureText(t).width+fs*1.4,sy=fs*2.3,row=0;
for(var y=-D/2-sy;y<=D/2+sy;y+=sy,row++){
for(var x=-D/2-sx+(row%2)*sx/2;x<=D/2+sx;x+=sx){ctx.fillText(t,x,y);}
}
ctx.restore();
dataUrl=cv.toDataURL('image/jpeg',0.92);
out.src=dataUrl;out.style.display='block';
}
function later(){readouts();clearTimeout(timer);timer=setTimeout(render,120);}
file.addEventListener('change',function(){
var f=file.files&&file.files[0];if(!f){return;}
var u=URL.createObjectURL(f),im=new Image();
im.onload=function(){if(lastUrl){URL.revokeObjectURL(lastUrl);}lastUrl=u;img=im;$('pickTxt').textContent='다른 사진 선택';say(firstMsg);render();};
im.onerror=function(){URL.revokeObjectURL(u);say('이 사진은 열 수 없어요. 다른 사진으로 해 보세요.',true);};
im.src=u;
file.value='';
});
[text,dest,alpha,size].forEach(function(el){el.addEventListener('input',later);});
date.addEventListener('change',render);
var sws=document.querySelectorAll('.sw');
Array.prototype.forEach.call(sws,function(b){
b.addEventListener('click',function(){
color=b.getAttribute('data-c');
Array.prototype.forEach.call(sws,function(s){s.classList.remove('on');});
b.classList.add('on');
render();
});
});
function toBlob(u){var b=atob(u.split(',')[1]),n=b.length,a=new Uint8Array(n);for(var i=0;i<n;i++){a[i]=b.charCodeAt(i);}return new Blob([a],{type:'image/jpeg'});}
save.addEventListener('click',function(){
if(!dataUrl){say('먼저 신분증 사진을 골라 주세요.',true);return;}
var name='사본_'+today().replace(/\./g,'')+'.jpg',blob=toBlob(dataUrl);
try{
var f=new File([blob],name,{type:'image/jpeg'});
if(navigator.canShare&&navigator.canShare({files:[f]})){
navigator.share({files:[f]}).catch(function(e){if(e&&e.name!=='AbortError'){say('저장 창을 열지 못했어요. 위 이미지를 길게 눌러 저장하세요.',true);}});
return;
}
}catch(e){}
var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
say('저장이 안 됐다면 위 이미지를 길게 눌러 사진에 저장하세요.');
});
try{
var ic=document.createElement('canvas');ic.width=ic.height=180;
var ix=ic.getContext('2d');
ix.fillStyle='#E24B4A';ix.fillRect(0,0,180,180);
ix.fillStyle='#fff';ix.font='700 64px -apple-system,"Apple SD Gothic Neo",sans-serif';
ix.textAlign='center';ix.textBaseline='middle';ix.fillText('사본',90,92);
var l=document.createElement('link');l.rel='apple-touch-icon';l.href=ic.toDataURL('image/png');document.head.appendChild(l);
}catch(e){}
readouts();
})();
</script>
</body>
</html>
